train_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: equivit.data.PatternNet
    split: "train"

    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]
        - role: augmentation
          transform:
            _target_: torchvision.transforms.RandomHorizontalFlip
            p: 0.5
        - role: augmentation
          transform:
            _target_: torchvision.transforms.RandomApply
            p: 0.5
            transforms:
              - _target_: torchvision.transforms.RandomRotation
                degrees: [90, 90]
        - role: augmentation
          transform:
            _target_: torchvision.transforms.RandomApply
            p: 0.5
            transforms:
              - _target_: torchvision.transforms.RandomRotation
                degrees: [180, 180]

  batch_size: 128
  num_workers: 12
  shuffle: true


val_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: equivit.data.PatternNet
    split: "val"

    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]


  batch_size: 128
  num_workers: 12
  shuffle: false

num_logits: 38
img_size: 256
