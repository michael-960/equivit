train_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: torchvision.datasets.CIFAR100
    root: "${oc.env:EXPERIMENT_DATA_DIR}"
    train: true

    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]

  batch_size: 128
  num_workers: 8
  shuffle: true


val_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: torchvision.datasets.CIFAR100
    root: "${oc.env:EXPERIMENT_DATA_DIR}"
    train: false
    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]

  batch_size: 128
  num_workers: 8
  shuffle: false

num_logits: 100
img_size: 32
binary: false