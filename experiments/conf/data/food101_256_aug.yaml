train_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: torchvision.datasets.Food101
    root: "${oc.env:EXPERIMENT_DATA_DIR}"
    split: train
    download: false

    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.CenterCrop
            size: 512
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Resize
            size: 256
        - role: augmentation
          transform:
            _target_: torchvision.transforms.ColorJitter
            brightness: 0.25
            contrast: 0.25
            saturation: 0.15
            hue: 0.03
        - role: augmentation
          transform:
            _target_: torchvision.transforms.RandomAutocontrast
            p: 0.2
        - role: augmentation
          transform:
            _target_: torchvision.transforms.RandomEqualize
            p: 0.1
        - role: augmentation
          transform:
            _target_: torchvision.transforms.RandomAdjustSharpness
            sharpness_factor: 1.5
            p: 0.2
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]

  batch_size: 128
  num_workers: 8
  shuffle: true


val_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: torchvision.datasets.Food101
    root: "${oc.env:EXPERIMENT_DATA_DIR}"
    split: test
    download: false

    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.CenterCrop
            size: 512
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Resize
            size: 256
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]
 


  batch_size: 128
  num_workers: 8
  shuffle: false

binary: false
num_logits: 101
img_size: 256
