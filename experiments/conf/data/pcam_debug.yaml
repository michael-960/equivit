train_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: torch.utils.data.Subset
    dataset:
      _target_: torchvision.datasets.PCAM
      root: "${oc.env:EXPERIMENT_DATA_DIR}"
      split: train
      download: false

      transform: 
        _target_: equivit.data.DataTransform
        steps: 
          - role: preprocessing
            transform:
              _target_: torchvision.transforms.ToTensor
          - role: preprocessing
            transform:
              _target_: torchvision.transforms.Normalize
              mean: [0.5, 0.5, 0.5]
              std: [0.5, 0.5, 0.5]

    indices:
      _target_: builtins.range
      _args_: [1000]

  batch_size: 64
  num_workers: 4
  shuffle: true


val_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: torch.utils.data.Subset
    dataset:
      _target_: torchvision.datasets.PCAM
      root: "${oc.env:EXPERIMENT_DATA_DIR}"
      split: val
      download: false

      transform: 
        _target_: equivit.data.DataTransform
        steps: 
          - role: preprocessing
            transform:
              _target_: torchvision.transforms.ToTensor
          - role: preprocessing
            transform:
              _target_: torchvision.transforms.Normalize
              mean: [0.5, 0.5, 0.5]
              std: [0.5, 0.5, 0.5]

    indices:
      _target_: builtins.range
      _args_: [1000]


  batch_size: 64
  num_workers: 4
  shuffle: false


binary: true
num_logits: 1
img_size: 96
