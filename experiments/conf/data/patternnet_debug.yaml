train_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: equivit.data.PatternNet
    split: "debug"

    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]


  batch_size: 128
  num_workers: 4
  shuffle: true


val_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: equivit.data.PatternNet
    split: "debug"

    transform: 
      _target_: equivit.data.DataTransform
      steps: 
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.ToTensor
        - role: preprocessing
          transform:
            _target_: torchvision.transforms.Normalize
            mean: [0.5, 0.5, 0.5]
            std: [0.5, 0.5, 0.5]


  batch_size: 128
  num_workers: 4
  shuffle: false

num_logits: 38
img_size: 256
