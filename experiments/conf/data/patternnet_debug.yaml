train_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: equivit.data.PatternNet
    split: "debug"

    transform: 
      _target_: torchvision.transforms.Compose
      transforms: 
        - _target_: torchvision.transforms.ToTensor

  batch_size: 16
  num_workers: 4
  shuffle: true


val_loader:
  _target_: torch.utils.data.DataLoader
  dataset: 
    _target_: equivit.data.PatternNet
    split: "debug"

    transform: 
      _target_: torchvision.transforms.Compose
      transforms: 
        - _target_: torchvision.transforms.ToTensor

  batch_size: 16
  num_workers: 4
  shuffle: false

