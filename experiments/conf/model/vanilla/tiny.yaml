_target_: equivit.models.build_named_sequential

backbone: 
  _target_: equivit.models.ViTBackbone
  config: 
    _target_: equivit.models.ViTBackboneConfig
    dim: 192
    depth: 12

    tokenizer_config: 
      _target_: equivit.models.TokenizerConfig
      img_size: 256
      patch_size: 16
      in_channels: 3

    transformer_block_config: 
      _target_: equivit.nn.vanilla.TransformerBlockConfig
      num_heads: 3
      dim_mlp: 768
      activation: 'gelu'

head: 
  _target_: equivit.nn.vanilla.ClassificationHead
  dim: 192
  num_logits: "${oc.select:data.num_logits,10}"
