defaults:
  - data: patternnet_aug
  - model: octic/d4/a/tiny
  - _self_

compile: true


optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  betas: [0.9, 0.999]


loss_fn:
  _target_: torch.nn.CrossEntropyLoss


trainer:
  _target_: lightning.Trainer
  max_epochs: 50
  accelerator: auto
  devices: auto
  enable_progress_bar: true


callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath:  "${hydra:runtime.output_dir}/checkpoints"
    monitor: val_loss
    mode: min
    save_top_k: 2
    save_last: true

  grad_norm:
    _target_: equivit.lightning.LogGradientNorm
    norm_type: 2.0
    layer_types: ['equivit.nn.EquivariantLinear']

  param_norm:
    _target_: equivit.lightning.LogParamNorm
    norm_type: 2.0
    layer_types: ['equivit.nn.EquivariantLinear']


loggers:
  mlflow:
    _target_: pytorch_lightning.loggers.MLFlowLogger
    experiment_name: "equivit-test"
    tracking_uri: "file:${hydra:runtime.cwd}/mlruns"

