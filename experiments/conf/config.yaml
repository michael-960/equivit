defaults:
  - data: patternnet
  - model: octic/D4/a/tiny
  - _self_

compile: true


optimizer:
   _target_: torch.optim.AdamW
   _partial_: true
   lr: 0.001
   betas: [0.9, 0.999]

loss_fn:
   _target_: torch.nn.CrossEntropyLoss


trainer:
   _target_: lightning.Trainer
   max_epochs: 60
   accelerator: auto
   devices: auto
   enable_progress_bar: true


callbacks:
   model_checkpoint:
      _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath:  "${hydra:runtime.output_dir}/checkpoints"
      filename: "best-{epoch:03d}-{val/best_loss:.4f}"
      monitor: "val/loss"
      mode: min
      save_top_k: 2
      save_last: true
      auto_insert_metric_name: false

   model_checkpoint_acc:
      _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath:  "${hydra:runtime.output_dir}/checkpoints"
      filename: "best-acc-{epoch:03d}-{val/best_accuracy:.4f}"
      monitor: "val/best_accuracy"
      mode: max
      save_top_k: 2
      save_last: true
      auto_insert_metric_name: false

   log_metrics:
      _target_: equivit.training.classification.callbacks.LogMetrics
      metrics:
         accuracy: 
            _target_: equivit.training.classification.metrics.Accuracy
         precision: 
            _target_: equivit.training.classification.metrics.Precision
         recall: 
            _target_: equivit.training.classification.metrics.Recall


loggers:
   mlflow:
      # _target_: pytorch_lightning.loggers.MLFlowLogger
      _target_: lightning.pytorch.loggers.MLFlowLogger
      experiment_name: "equivit-test"
      tracking_uri: "file:${hydra:runtime.cwd}/mlruns"
