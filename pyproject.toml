[project]
name = "equivit"
authors = [
    {name="Chih-Chun Wang", email="mike.wang96029@gmail.com"},
]
version = "0.0.3"
description = "Build and test equivariant Vision Transformers."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "einops>=0.8.2",
    "matplotlib>=3.10.9",
    "lightning>=2.6.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "datasets>=4.8.5",
    "seaborn>=0.13.2"
]

[project.urls]
Homepage = "https://github.com/michael-960/equivit"

[tool.pytest.ini_options]
testpaths = ["tests"]